name: Generate and Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Validate SKILL.md frontmatter
        run: |
          errors=0
          expected_version=$(cat VERSION)
          for skill_file in plugins/*/skills/*/SKILL.md; do
            if ! head -20 "$skill_file" | grep -q '^name:'; then
              echo "ERROR: Missing 'name' in frontmatter: $skill_file"
              errors=$((errors + 1))
            fi
            if ! head -20 "$skill_file" | grep -q '^description:'; then
              echo "ERROR: Missing 'description' in frontmatter: $skill_file"
              errors=$((errors + 1))
            fi
            if ! head -20 "$skill_file" | grep -q '^version:'; then
              echo "ERROR: Missing 'version' in frontmatter: $skill_file"
              errors=$((errors + 1))
            else
              actual_version=$(head -20 "$skill_file" | grep '^version:' | sed 's/version: //')
              if [ "$actual_version" != "$expected_version" ]; then
                echo "ERROR: $skill_file has version '$actual_version', expected '$expected_version'"
                errors=$((errors + 1))
              fi
            fi
            echo "OK: $skill_file"
          done
          if [ $errors -gt 0 ]; then
            echo "FAILED: $errors validation error(s)"
            exit 1
          fi

      - name: Validate manifest versions match VERSION file
        run: |
          expected=$(cat VERSION)
          errors=0
          for manifest in plugins/*/.claude-plugin/plugin.json plugins/*/.codex-plugin/plugin.json plugins/*/.github/plugin/plugin.json gemini-extension.json .codex-plugin/plugin.json; do
            if [ -f "$manifest" ]; then
              actual=$(python3 -c "import json; print(json.load(open('$manifest')).get('version', 'MISSING'))")
              if [ "$actual" != "$expected" ]; then
                echo "ERROR: $manifest has version '$actual', expected '$expected'"
                errors=$((errors + 1))
              else
                echo "OK: $manifest (v$actual)"
              fi
            fi
          done
          # Validate marketplace plugin versions match VERSION
          if [ -f ".claude-plugin/marketplace.json" ]; then
            printf '%s\n' 'import json,sys' 'e=open("VERSION").read().strip()' 'd=json.load(open(".claude-plugin/marketplace.json"))' 'n=0' 'for p in d.get("plugins",[]):' '  v=p.get("version","MISSING")' '  nm=p.get("name","unknown")' '  if v!=e:' '    print(f"ERROR: marketplace.json plugin {nm!r} has {v!r}, expected {e!r}")' '    n+=1' '  else:' '    print(f"OK: marketplace.json {nm!r} (v{v})")' 'sys.exit(n)' > /tmp/_mp_check.py
            if ! python3 /tmp/_mp_check.py; then
              errors=$((errors + 1))
            fi
          fi
          if [ $errors -gt 0 ]; then
            echo "FAILED: $errors version mismatch(es)"
            exit 1
          fi

      - name: Validate JSON manifests
        run: |
          for f in plugins/*/.claude-plugin/plugin.json plugins/*/.codex-plugin/plugin.json plugins/*/.github/plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/marketplace.json gemini-extension.json; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null
              echo "OK: $f"
            fi
          done

      - name: Validate symlinks resolve
        run: |
          errors=0
          for link in skills/*/ .opencode/skills/*/ .cursor/skills/*/; do
            link_name="${link%/}"
            if [ -L "$link_name" ]; then
              if [ ! -e "$link_name" ]; then
                echo "ERROR: Broken symlink: $link_name -> $(readlink "$link_name")"
                errors=$((errors + 1))
              else
                echo "OK: $link_name -> $(readlink "$link_name")"
              fi
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "FAILED: $errors broken symlink(s)"
            exit 1
          fi

      - name: Validate wingman Copilot bundle
        run: bash scripts/test-wingman-skills.sh

      - name: Verify wingman bundle is up to date (PR only)
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/generate-wingman-skills.sh
          if ! git diff --quiet plugins/wingman/copilot-skills/; then
            echo "ERROR: wingman copilot-skills/ is out of date. Run 'bash scripts/generate-wingman-skills.sh' and commit the output."
            git diff --stat plugins/wingman/copilot-skills/
            exit 1
          fi
          echo "OK: wingman copilot-skills/ is up to date."

      - name: Validate hook scripts are executable
        run: |
          errors=0
          for hook in plugins/*/hooks/* plugins/*/hooks/cursor/*; do
            # Skip JSON config files and .cmd wrappers
            if [[ "$hook" == *.json ]] || [[ "$hook" == *.cmd ]]; then
              continue
            fi
            if [ -f "$hook" ] && [ ! -x "$hook" ]; then
              echo "ERROR: Hook script not executable: $hook"
              errors=$((errors + 1))
            else
              echo "OK: $hook"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "FAILED: $errors hook script(s) not executable. Run: chmod +x <file>"
            exit 1
          fi

      - name: Validate SKILL.md best practices (Anthropic spec)
        run: |
          cat > /tmp/skill_check.py << 'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          errors = 0
          warnings = 0
          fm_match = re.match(r'^---\n(.*?)\n---\n', content, re.DOTALL)
          if not fm_match:
              print(f"ERROR [{path}]: No YAML frontmatter found")
              sys.exit(1)
          fm = fm_match.group(1)
          body = content[fm_match.end():]
          name_match = re.search(r'^name:\s*(.+)', fm, re.MULTILINE)
          if name_match:
              name = name_match.group(1).strip()
              if len(name) > 64:
                  print(f"ERROR [{path}]: name exceeds 64 chars ({len(name)}): '{name}'")
                  errors += 1
              if not re.match(r'^[a-z0-9-]+$', name):
                  print(f"ERROR [{path}]: name must be [a-z0-9-] only: '{name}'")
                  errors += 1
              if 'anthropic' in name or 'claude' in name:
                  print(f"ERROR [{path}]: name contains reserved word ('anthropic'/'claude'): '{name}'")
                  errors += 1
          desc_match = re.search(r'^description:(.*?)(?=\n[a-z_]|\Z)', fm, re.MULTILINE | re.DOTALL)
          if desc_match:
              raw = desc_match.group(1)
              desc = ' '.join(l.strip() for l in raw.strip().lstrip('>|').splitlines() if l.strip())
              if not desc:
                  print(f"ERROR [{path}]: description is empty")
                  errors += 1
              elif len(desc) > 1024:
                  print(f"ERROR [{path}]: description exceeds 1024 chars ({len(desc)})")
                  errors += 1
              if '<' in desc or '>' in desc:
                  print(f"ERROR [{path}]: description contains XML-style tags")
                  errors += 1
              if re.search(r'\bI can\b|\bI will\b|\bI am\b', desc):
                  print(f"ERROR [{path}]: description uses first-person ('I can/will/am')")
                  errors += 1
          body_lines = body.count('\n')
          if body_lines > 600:
              print(f"ERROR [{path}]: body is {body_lines} lines (hard limit: <=600; must split content into reference files)")
              errors += 1
          elif body_lines > 500:
              print(f"WARN  [{path}]: body is {body_lines} lines (best practice: <=500; split long content into reference files)")
              warnings += 1
          if re.search(r'[A-Za-z0-9_\-]\\[A-Za-z0-9_\-]{2,}', body):
              print(f"ERROR [{path}]: Windows-style path (backslash) found — use forward slashes")
              errors += 1
          status = "OK" if errors == 0 else "FAIL"
          if warnings:
              status += f" ({warnings} warning(s))"
          print(f"{status}: {path}")
          sys.exit(errors)
          PYEOF
          errors=0
          for skill_file in plugins/*/skills/*/SKILL.md; do
            python3 /tmp/skill_check.py "$skill_file" || errors=$((errors + 1))
          done
          if [ $errors -gt 0 ]; then
            echo "FAILED: $errors SKILL.md file(s) have best-practice violations"
            exit 1
          fi

      - name: Check reference file best practices
        run: |
          warnings=0
          while IFS= read -r -d '' ref_file; do
            lines=$(wc -l < "$ref_file")
            if [ "$lines" -gt 100 ]; then
              if ! grep -qi "## contents\|## table of contents\|## toc\|- \[" "$ref_file"; then
                echo "WARN: ${lines} lines, no table of contents: $ref_file"
                warnings=$((warnings + 1))
              else
                echo "OK: $ref_file (${lines} lines)"
              fi
            fi
          done < <(find plugins/*/skills/*/references -name "*.md" -print0 2>/dev/null)
          if [ $warnings -gt 0 ]; then
            echo ""
            echo "NOTE: $warnings reference file(s) over 100 lines lack a table of contents."
            echo "Best practice: add a '## Contents' section at the top so Claude can navigate large files."
          fi

  generate-cursor-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Generate Cursor rules
        run: bash scripts/generate-cursor-rules.sh

      - name: Verify critical content in generated rules
        run: |
          errors=0
          # Check that "Fix ALL findings" survived generation
          if ! grep -q "Fix ALL findings" cursor/.cursor/rules/stackhawk-hawkscan.mdc; then
            echo "ERROR: 'Fix ALL findings' not found in generated stackhawk-hawkscan.mdc"
            errors=$((errors + 1))
          else
            echo "OK: 'Fix ALL findings' present in stackhawk-hawkscan.mdc"
          fi
          # Check that alwaysApply is true for main rule
          if ! grep -q "alwaysApply: true" cursor/.cursor/rules/stackhawk-hawkscan.mdc; then
            echo "ERROR: alwaysApply not set to true in stackhawk-hawkscan.mdc"
            errors=$((errors + 1))
          else
            echo "OK: alwaysApply: true in stackhawk-hawkscan.mdc"
          fi
          if [ $errors -gt 0 ]; then
            echo "FAILED: $errors content check(s) failed"
            exit 1
          fi

      - name: Check for uncommitted changes (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet cursor/; then
            echo "ERROR: Cursor rules are out of date. Run 'bash scripts/generate-cursor-rules.sh' and commit the output."
            git diff --stat cursor/
            exit 1
          fi
          echo "OK: Cursor rules are up to date."

      - name: Commit generated rules (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cursor/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate cursor rules"
            git push
          fi
