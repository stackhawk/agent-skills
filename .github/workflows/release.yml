name: Release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max
on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

# Releases are numbered by tags (ENG-1160): there is no VERSION file and no version-bump commit.
# resolve works out the number once per run (the latest release tag + 1, more for a `Release: minor`
# or `Release: major` line in a merged pull request). validate stamps it into a scratch copy of the
# tree and checks every manifest, skill and generated copy, so a release that cannot be stamped
# never claims a number. claim marks the number, tag releases it on the merged commit, and the
# GitHub Release, the marketplace sync and the eval baseline follow the tag. The tree itself keeps a
# placeholder version (.version-bump.json): the marketplace sync stamps the tag's version into the
# snapshot it publishes.
#
# A run that fails after the claim leaves it: re-run its failed jobs to finish the release, or run
# Abandon release if the merged change itself breaks it. Every step after the tag is idempotent, so a
# re-run of a tagged release picks up where it stopped.
#
# Every job runs on the agent-skills runner: this repo is public, and the biodome-ci-* runners live in a
# runner group that does not serve public repositories. That image has no `gh`, so the jobs that call it
# install a pinned, checksum-verified copy (scripts/ci/install-gh.sh).
#
# claim, tag and the marketplace and baseline steps run as the release App, whose key only
# ci-deploy-preprod may read, so those jobs assume it with the job's OIDC token (main only).
jobs:

  resolve:
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}
    steps:
      ### Biodome setup: the whole history and every tag, which the resolver reads
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Resolve the release version
        id: release
        run: biodome-rs ci version resolve
        env:
          GH_TOKEN: ${{ github.token }}

  # Stamps the resolved version into this runner's copy and runs the checks that used to run from the
  # tag: nothing here is committed or published.
  validate:
    needs: [ resolve ]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      ### Biodome setup
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
      - name: Stamp the release version
        run: bash scripts/bump-version.sh "$RELEASE_VERSION"
      - name: Regenerate the wingman Copilot bundle
        run: bash scripts/generate-wingman-skills.sh
      - name: Validate the stamped tree
        run: |
          bash scripts/check-version.sh "$RELEASE_VERSION"
          bash scripts/test-wingman-skills.sh
      - name: Verify Cursor rules are up to date
        run: |
          bash scripts/generate-cursor-rules.sh
          git add -N cursor/
          if ! git diff --quiet cursor/; then
            echo "ERROR: Cursor rules are out of date. Run 'bash scripts/generate-cursor-rules.sh' and commit."
            git diff --stat cursor/
            exit 1
          fi

  # The number is claimed before anything else is written under it. The claim and the tag are made as
  # the release App. Its status functions keep a skipped ancestor from skipping the release unnoticed,
  # and a failed or cancelled validate from claiming a number.
  claim:
    if: github.event_name == 'push' && github.ref_name == 'main' && !failure() && !cancelled()
    needs: [ resolve, validate ]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CI_ROLES: ${{ vars.CI_ROLES }}
      STACKHAWK_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      ### Biodome setup
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
      - name: CI identity (ci-deploy-preprod)
        run: |
          biodome-rs aws assume ci-deploy-preprod --profile deploy --source oidc
          echo "AWS_PROFILE=deploy" >> "$GITHUB_ENV"
      # The App's token bypasses the tag ruleset, so only the claim sees it: it is not put in
      # GITHUB_ENV. A re-run of a release that is already tagged claims nothing.
      - name: Claim the release number
        if: needs.resolve.outputs.released != 'true'
        run: |
          token="$(biodome ci github-app-token --repository "${GITHUB_REPOSITORY#*/}" --permission contents=write)"
          echo "::add-mask::$token"
          GH_TOKEN="$token" biodome-rs ci version claim

  # The GitHub Release is drafted before the tag, where nobody can see it, and published after it: the
  # tag says the release is complete, and a failed run must not leave a public release without one.
  draft-release:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [ resolve, claim ]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: v${{ needs.resolve.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Install the GitHub CLI
        run: bash scripts/ci/install-gh.sh
      - name: Draft the GitHub Release
        run: |
          # The API list includes drafts, which `gh release view <tag>` does not find.
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id")"
          if [ -n "$existing" ]; then
            echo "GitHub Release already exists for ${RELEASE_TAG}"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes

  # Idempotent for a commit that is already tagged.
  tag:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [ resolve, claim, draft-release ]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CI_ROLES: ${{ vars.CI_ROLES }}
      STACKHAWK_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      ### Biodome setup
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
      - name: CI identity (ci-deploy-preprod)
        run: |
          biodome-rs aws assume ci-deploy-preprod --profile deploy --source oidc
          echo "AWS_PROFILE=deploy" >> "$GITHUB_ENV"
      - name: Tag the release
        run: |
          token="$(biodome ci github-app-token --repository "${GITHUB_REPOSITORY#*/}" --permission contents=write)"
          echo "::add-mask::$token"
          GH_TOKEN="$token" biodome-rs ci version tag

  publish-release:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [ resolve, tag ]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: v${{ needs.resolve.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Install the GitHub CLI
        run: bash scripts/ci/install-gh.sh
      - name: Publish the GitHub Release
        run: |
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | \"\\(.id) \\(.draft)\"")"
          if [ -z "$release" ]; then
            echo "ERROR: no GitHub Release for ${RELEASE_TAG}"
            exit 1
          fi
          if [ "${release#* }" = "false" ]; then
            echo "GitHub Release ${RELEASE_TAG} is already published"
            exit 0
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release% *}" -F draft=false

  update-marketplace:
    name: Sync marketplace
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [ resolve, tag ]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CI_ROLES: ${{ vars.CI_ROLES }}
      RELEASE_TAG: v${{ needs.resolve.outputs.version }}
    steps:
      ### Biodome setup: every tag, which the sync resolves the release commit from
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
        with:
          fetch-depth: 0
          filter: tree:0
      - name: CI identity (ci-deploy-preprod)
        run: |
          biodome-rs aws assume ci-deploy-preprod --profile deploy --source oidc
          echo "AWS_PROFILE=deploy" >> "$GITHUB_ENV"
      # The App's token replaces the retired Terraform GitHub token. It writes the marketplace repo
      # only, so a step that does not push never sees it.
      - name: Marketplace App token
        run: |
          token="$(biodome ci github-app-token --repository agent-skills-marketplace --permission contents=write)"
          echo "::add-mask::$token"
          echo "MARKETPLACE_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Clone agent-skills-marketplace
        run: git clone --branch main "https://x-access-token:${MARKETPLACE_TOKEN}@github.com/stackhawk/agent-skills-marketplace.git" /tmp/marketplace
      # The sync takes the version from the tag and stamps it into the snapshot itself: the tagged
      # tree carries the placeholder.
      - name: Sync marketplace from release tag
        run: |
          python3 /tmp/marketplace/scripts/sync-agent-skills.py \
            --source-repo "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s /tmp/marketplace/tests
      - name: Push marketplace sync to main
        run: |
          cd /tmp/marketplace
          git config user.name "hawkdeploy"
          git config user.email "hawkdeploy@stackhawk.com"
          # Keep these paths in sync with install() in marketplace's sync-agent-skills.py.
          git add -A -- plugins bundles skills sources.json \
            .claude-plugin/marketplace.json .github/plugin/marketplace.json \
            .agents/plugins/marketplace.json .codex-plugin/marketplace.json
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "ERROR: Marketplace sync left changes outside the staged paths. Update this list to match install()."
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Marketplace already contains ${RELEASE_TAG}"
            exit 0
          fi
          git commit -m "chore: sync agent-skills ${RELEASE_TAG}"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests
            if ! git push origin HEAD:main; then
              echo "ERROR: Marketplace main push failed after one fetch-rebase retry."
              exit 1
            fi
          fi

  # Best effort: the release is complete once it is tagged, so a baseline that cannot be dispatched
  # warns instead of failing the run. Dispatch Capture Eval Baseline by hand with the tag.
  capture-baseline:
    name: Trigger baseline capture
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [ resolve, tag ]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CI_ROLES: ${{ vars.CI_ROLES }}
      RELEASE_TAG: v${{ needs.resolve.outputs.version }}
    steps:
      ### Biodome setup
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
      - name: CI identity (ci-deploy-preprod)
        run: |
          biodome-rs aws assume ci-deploy-preprod --profile deploy --source oidc
          echo "AWS_PROFILE=deploy" >> "$GITHUB_ENV"
      - name: Install the GitHub CLI
        continue-on-error: true
        run: bash scripts/ci/install-gh.sh
      - name: Dispatch capture-baseline
        run: |
          token="$(biodome ci github-app-token --repository "${GITHUB_REPOSITORY#*/}" --permission actions=write)"
          echo "::add-mask::$token"
          if ! GH_TOKEN="$token" gh workflow run capture-baseline.yml -f tag="$RELEASE_TAG"; then
            echo "::warning::could not dispatch capture-baseline.yml for ${RELEASE_TAG}; run it by hand"
          fi
