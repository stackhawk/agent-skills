name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only — skip release creation. Run from a tag (e.g. v1.6.2) using the "Use workflow from" picker above.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve tag from ref
        id: version
        run: |
          ref="${GITHUB_REF}"
          if [[ "$ref" != refs/tags/* ]]; then
            echo "ERROR: This workflow must be run from a tag, not a branch."
            echo "Use the 'Use workflow from' picker to select a tag (e.g. v1.6.2)."
            exit 1
          fi
          tag="${ref#refs/tags/}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Running release for tag: ${tag}"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Validate VERSION file matches tag
        run: |
          expected="${{ steps.version.outputs.version }}"
          actual=$(cat VERSION)
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: VERSION file has '${actual}', expected '${expected}'"
            exit 1
          fi
          echo "OK: VERSION = ${actual}"

      - name: Validate all manifest versions match tag
        run: |
          expected="${{ steps.version.outputs.version }}"
          errors=0
          for manifest in plugins/*/.claude-plugin/plugin.json plugins/*/.codex-plugin/plugin.json plugins/*/.github/plugin/plugin.json gemini-extension.json .codex-plugin/plugin.json; do
            if [ -f "$manifest" ]; then
              actual=$(python3 -c "import json; print(json.load(open('$manifest')).get('version', 'MISSING'))")
              if [ "$actual" != "$expected" ]; then
                echo "ERROR: $manifest has '${actual}', expected '${expected}'"
                errors=$((errors + 1))
              else
                echo "OK: $manifest (v${actual})"
              fi
            fi
          done
          if [ $errors -gt 0 ]; then exit 1; fi

      - name: Validate marketplace plugin versions match tag
        run: |
          expected="${{ steps.version.outputs.version }}"
          python3 - "$expected" << 'PYEOF'
          import json, sys
          expected = sys.argv[1]
          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)
          errors = 0
          for p in data.get('plugins', []):
              actual = p.get('version', 'MISSING')
              name = p.get('name', 'unknown')
              if actual != expected:
                  print(f"ERROR: marketplace.json '{name}' has '{actual}', expected '{expected}'")
                  errors += 1
              else:
                  print(f"OK: marketplace.json '{name}' (v{actual})")
          sys.exit(errors)
          PYEOF

      - name: Validate SKILL.md versions match tag
        run: |
          expected="${{ steps.version.outputs.version }}"
          errors=0
          for skill_file in plugins/*/skills/*/SKILL.md; do
            if [ -f "$skill_file" ]; then
              actual=$(head -20 "$skill_file" | grep '^version:' | sed 's/version: //')
              if [ -z "$actual" ]; then
                echo "ERROR: Missing version in frontmatter: $skill_file"
                errors=$((errors + 1))
              elif [ "$actual" != "$expected" ]; then
                echo "ERROR: $skill_file has '${actual}', expected '${expected}'"
                errors=$((errors + 1))
              else
                echo "OK: $skill_file (v${actual})"
              fi
            fi
          done
          if [ $errors -gt 0 ]; then exit 1; fi

      - name: Validate wingman Copilot bundle
        run: bash scripts/test-wingman-skills.sh

      - name: Verify wingman bundle is up to date
        run: |
          bash scripts/generate-wingman-skills.sh
          git add -N plugins/wingman/copilot-skills/
          if ! git diff --quiet plugins/wingman/copilot-skills/ plugins/wingman/.codex-plugin/plugin.json; then
            echo "ERROR: wingman copilot-skills/ or its Codex manifest is out of date. Run 'bash scripts/generate-wingman-skills.sh' and commit the output."
            git diff --stat plugins/wingman/copilot-skills/ plugins/wingman/.codex-plugin/plugin.json
            exit 1
          fi
          echo "OK: wingman copilot-skills/ is up to date."

      - name: Extract changelog section
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          notes=$(awk "/^## \\[${version}\\]/{found=1; next} /^## \\[/{found=0} found{print}" CHANGELOG.md)
          if [ -z "$notes" ]; then notes="Release ${{ steps.version.outputs.tag }}"; fi
          printf '%s' "$notes" > /tmp/release-notes.txt
          cat /tmp/release-notes.txt

      - name: Create GitHub Release
        if: inputs.dry_run != true
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "GitHub Release already exists for ${{ steps.version.outputs.tag }}"
            exit 0
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run summary
        if: inputs.dry_run == true
        run: echo "DRY RUN complete — all checks passed for ${{ steps.version.outputs.tag }}"

  capture-baseline:
    name: Trigger baseline capture
    needs: release
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch capture-baseline
        # GITHUB_TOKEN can dispatch workflows in the same repo for most orgs.
        # If org policy blocks it, swap to the TF_GITHUB_TOKEN PAT that
        # update-marketplace pulls from SSM (aws ssm get-parameter --name TF_GITHUB_TOKEN).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run capture-baseline.yml -f tag="$RELEASE_TAG"

  update-marketplace:
    name: Propose marketplace sync
    needs: release
    if: inputs.dry_run != true
    runs-on: agent-skills-amd-4cpu
    steps:
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2

      - name: Resolve cache
        run: |
          biodome ci restore-cache
          rm -rf ./*.tar.lz4

      - name: Pull secrets
        run: biodome ci save-secrets

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Resolve commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clone agent-skills-marketplace
        run: git clone https://github.com/stackhawk/agent-skills-marketplace.git /tmp/marketplace

      - name: Reuse or create sync branch
        id: sync-branch
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          branch="automation/sync-agent-skills-${TAG}"
          if [ -n "$(git -C /tmp/marketplace ls-remote --heads origin "$branch")" ]; then
            git -C /tmp/marketplace fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            git -C /tmp/marketplace switch -c "$branch" --track "origin/$branch"
          else
            git -C /tmp/marketplace switch -c "$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Sync marketplace from release tag
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          python3 /tmp/marketplace/scripts/sync-agent-skills.py \
            --source-repo "$GITHUB_WORKSPACE" --tag "$TAG"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s /tmp/marketplace/tests

      - name: Open marketplace sync PR
        env:
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
          SYNC_BRANCH: ${{ steps.sync-branch.outputs.branch }}
        run: |
          cd /tmp/marketplace
          git config user.name "hawkdeploy"
          git config user.email "hawkdeploy@stackhawk.com"
          # Keep these paths in sync with install() in marketplace's sync-agent-skills.py.
          git add -A -- plugins skills sources.json \
            .claude-plugin/marketplace.json .github/plugin/marketplace.json \
            .agents/plugins/marketplace.json .codex-plugin/marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync agent-skills ${TAG}"
          fi
          if git diff --quiet origin/main HEAD; then
            echo "Marketplace already contains ${TAG}"
            exit 0
          fi
          GH_PAT=$(aws ssm get-parameter --name TF_GITHUB_TOKEN --query 'Parameter.Value' --output text --with-decryption)
          echo "::add-mask::${GH_PAT}"
          export GH_TOKEN="$GH_PAT"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/stackhawk/agent-skills-marketplace.git"
          git push --set-upstream origin "HEAD:${SYNC_BRANCH}"
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repo = "stackhawk/agent-skills-marketplace"
          endpoint = f"https://api.github.com/repos/{repo}/pulls"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          branch = os.environ["SYNC_BRANCH"]
          query = urlencode({"state": "open", "head": f"stackhawk:{branch}"})
          with urlopen(Request(f"{endpoint}?{query}", headers=headers), timeout=30) as response:
              existing_prs = json.load(response)
          if existing_prs:
              print(f"Marketplace sync PR already open: {existing_prs[0]['html_url']}")
          else:
              tag = os.environ["TAG"]
              sha = os.environ["SHA"]
              body = (
                  f"Sync the marketplace snapshots from agent-skills {tag} ({sha}).\n\n"
                  "The marketplace sync script regenerates local Claude plugin sources, "
                  "pinned Codex and Copilot catalogs, and standalone skills. Review the "
                  "generated diff before merging. Directory submission remains a separate "
                  "manual step.\n"
              )
              payload = {"base": "main", "head": branch,
                         "title": f"chore: sync agent-skills {tag}", "body": body}
              request = Request(endpoint, data=json.dumps(payload).encode(),
                                headers=headers, method="POST")
              with urlopen(request, timeout=30) as response:
                  print(json.load(response)["html_url"])
          PY
