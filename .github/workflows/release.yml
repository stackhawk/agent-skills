name: Release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max
on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

# Releases are numbered by tags (ENG-1160): there is no VERSION file and no version-bump commit.
# resolve works out the number once per run (the latest release tag + 1, more for a `Release: minor`
# or `Release: major` line in a merged pull request). validate stamps it into a scratch copy of the
# tree and checks every manifest, skill and generated copy, so a release that cannot be stamped
# never claims a number. claim marks the number and tag releases it on the merged commit. The tree
# itself keeps a placeholder version (.version-bump.json).
#
# A merge versions and tags the commit and publishes nothing. A person chooses when a tag reaches
# users by running Publish release (publish-release.yml) from main with that tag: it syncs the
# marketplace, publishes the GitHub Release and starts the eval baseline.
#
# validate also exports the payload the marketplace sync would publish (scripts/export-marketplace.py
# stamps the tag's version into it), runs the marketplace sync on it in a scratch clone and stages
# the result without a push, so a merge whose sync would fail, write outside the published paths
# (scripts/ci/stage-marketplace-sync.sh), or publish the Cursor router rule or stop hook twice
# (scripts/check-marketplace-layout.py) never claims a number. The sync takes the payload with
# --export (RELEASING.md, "Cursor distribution prerequisites"). Publish release repeats these
# steps on the tag it publishes.
#
# A run that fails after the claim leaves it: re-run its failed jobs to finish the release, or run
# Abandon release if the tag job cannot succeed. claim and tag are idempotent, so a re-run of a
# tagged release picks up where it stopped.
#
# Every job runs on the agent-skills runner: this repo is public, and the biodome-ci-* runners live in a
# runner group that does not serve public repositories.
#
# claim and tag run as the release App, whose key only ci-deploy-preprod may read, so those jobs
# assume it with the job's OIDC token (main only).
jobs:

  resolve:
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}
    steps:
      ### Biodome setup: the whole history and every tag, which the resolver reads
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Resolve the release version
        id: release
        run: biodome-rs ci version resolve
        env:
          GH_TOKEN: ${{ github.token }}

  # Stamps the resolved version into this runner's copy and runs the checks that used to run from the
  # tag: nothing here is committed or published.
  validate:
    needs: [ resolve ]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      ### Biodome setup
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
      - name: Stamp the release version
        run: bash scripts/bump-version.sh "$RELEASE_VERSION"
      - name: Regenerate the wingman bundled skills
        # Also the skill copies of the Cursor-only hawkscan plugin (cursor-plugins/hawkscan/skills/).
        run: bash scripts/generate-wingman-skills.sh
      - name: Validate the stamped tree
        # The layout check covers direct installs from this repository, which is a Claude Code
        # and a Cursor marketplace too: no install may load the router rule or the stop hook twice,
        # also a Claude Code install next to one native Cursor install.
        run: |
          bash scripts/check-version.sh "$RELEASE_VERSION"
          bash scripts/test-wingman-skills.sh
          python3 scripts/check-marketplace-layout.py --no-installers .
      - name: Verify the Cursor adapter is up to date
        # The stamp adds a version to each .cursor-plugin/plugin.json; the generator keeps it.
        run: python3 scripts/generate-cursor-adapter.py --check
      # The export reads the commit, not this stamped working tree, and stamps its own copy.
      - name: Export the marketplace payload
        run: |
          python3 scripts/export-marketplace.py --ref HEAD --version "$RELEASE_VERSION" \
            --dest "$RUNNER_TEMP/marketplace-export"
      # The marketplace is public, so this clone needs no token, and nothing here is pushed. The sync
      # resolves the release commit from the tag, so a local tag is forced onto HEAD for this step and
      # deleted when it ends; it is never pushed (claim and tag make the real one).
      - name: Dry-run the marketplace sync
        run: |
          tag="v${RELEASE_VERSION}"
          git tag -f "$tag" HEAD
          trap 'git tag -d "$tag" >/dev/null' EXIT
          git clone --quiet --depth 1 --branch main \
            https://github.com/stackhawk/agent-skills-marketplace.git "$RUNNER_TEMP/marketplace"
          python3 "$RUNNER_TEMP/marketplace/scripts/sync-agent-skills.py" \
            --source-repo "$GITHUB_WORKSPACE" --tag "$tag" --export "$RUNNER_TEMP/marketplace-export"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s "$RUNNER_TEMP/marketplace/tests"
          python3 scripts/check-marketplace-layout.py --run-installers --version "$RELEASE_VERSION" \
            "$RUNNER_TEMP/marketplace"
          bash scripts/ci/stage-marketplace-sync.sh "$RUNNER_TEMP/marketplace"
  # The number is claimed before anything else is written under it. The claim and the tag are made as
  # the release App. Its status functions keep a skipped ancestor from skipping the release unnoticed,
  # and a failed or cancelled validate from claiming a number.
  claim:
    if: github.event_name == 'push' && github.ref_name == 'main' && !failure() && !cancelled()
    needs: [ resolve, validate ]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CI_ROLES: ${{ vars.CI_ROLES }}
      STACKHAWK_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      ### Biodome setup
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
      - name: CI identity (ci-deploy-preprod)
        run: |
          biodome-rs aws assume ci-deploy-preprod --profile deploy --source oidc
          echo "AWS_PROFILE=deploy" >> "$GITHUB_ENV"
      # The App's token bypasses the tag ruleset, so only the claim sees it: it is not put in
      # GITHUB_ENV. A re-run of a release that is already tagged claims nothing.
      - name: Claim the release number
        if: needs.resolve.outputs.released != 'true'
        run: |
          token="$(biodome ci github-app-token --repository "${GITHUB_REPOSITORY#*/}" --permission contents=write)"
          echo "::add-mask::$token"
          GH_TOKEN="$token" biodome-rs ci version claim

  # Idempotent for a commit that is already tagged.
  tag:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [ resolve, claim ]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CI_ROLES: ${{ vars.CI_ROLES }}
      STACKHAWK_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      ### Biodome setup
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
      - name: CI identity (ci-deploy-preprod)
        run: |
          biodome-rs aws assume ci-deploy-preprod --profile deploy --source oidc
          echo "AWS_PROFILE=deploy" >> "$GITHUB_ENV"
      - name: Tag the release
        run: |
          token="$(biodome ci github-app-token --repository "${GITHUB_REPOSITORY#*/}" --permission contents=write)"
          echo "::add-mask::$token"
          GH_TOKEN="$token" biodome-rs ci version tag
