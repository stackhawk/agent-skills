name: Tag on merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Create version tag
        run: |
          version=$(cat VERSION)
          tag="v${version}"

          # Check the remote, not the local clone: actions/checkout does a
          # shallow fetch without tags, so a local rev-parse would always miss
          # an existing tag and then fail at `git push` (tag already exists).
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag '${tag}' already exists on remote — skipping (VERSION was not bumped in this push)"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
          echo "Created tag: ${tag}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
