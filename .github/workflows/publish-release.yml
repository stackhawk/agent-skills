name: Publish release
run-name: Publish release ${{ inputs.tag }}${{ inputs.rehearsal && ' (rehearsal)' || '' }}
concurrency:
  # Every publish updates the same marketplace main. Serialize publishes and their retries.
  group: agent-skills-publish
  cancel-in-progress: false
  queue: max
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to publish, such as v2.7.9. It must exist and be on main.'
        required: true
        type: string
      rehearsal:
        description: 'Rehearse only: do everything but push to the marketplace, create or publish a GitHub Release, or start the baseline.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# A merge to main versions and tags the commit (release.yml) and publishes nothing. This workflow is
# the step a person starts by hand, from main, to put one of those tags in front of users: it syncs the
# marketplace, publishes the GitHub Release and starts the eval baseline. The tag input chooses both
# the version and the exact source commit. The source tree carries 0.0.0-dev; validation and export
# stamp the release version into scratch copies.
#
# resolve checks that the tag is a stable vX.Y.Z tag on origin and on main. Every job after it checks
# out the tag's commit and checks again that the tag still names it. Marketplace main is the consumer
# pin: an older tag never replaces a newer one, and running the tag that is already published changes
# nothing. No job here creates, moves, replaces or deletes a tag or a claim.
#
# Every job runs only on main (`if: github.ref == 'refs/heads/main'`), so a dispatch from another
# branch does nothing. Marketplace sync and baseline run as the release App, whose key only
# ci-deploy-preprod may read, so those jobs assume it with the job's OIDC token (main only). The role
# is assumed, and the marketplace token minted, only after the marketplace's own tests and installers
# have run and the commit exists; the token is used only by a push from a pristine repository. A push
# that loses a race to another marketplace commit is re-run, not rebased.
#
# With `rehearsal` on, the run does everything that can fail for real reasons (resolve, validate, export,
# the role, the marketplace token, the sync into the scratch clone, the release lookups, the baseline
# token) and skips the four steps that write: the marketplace push, drafting the GitHub Release,
# publishing it, and dispatching the baseline. Each of those steps has `!inputs.rehearsal` in its
# `if`; the steps that stand in for them in a rehearsal only read. The last job reports what a real run
# would have done.
#
# Every job runs on the agent-skills runner: this repo is public, and the biodome-ci-* runners live in a
# runner group that does not serve public repositories. That image has no `gh`, so the jobs that call it
# install a pinned, checksum-verified copy (scripts/ci/install-gh.sh).
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out main with every tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and verify the release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/ci/release_tag.py resolve

  # Stamps the tag's version into this runner's copy and runs the checks that every merge's release
  # run makes: nothing here is committed or published.
  validate:
    if: github.ref == 'refs/heads/main'
    needs: [resolve]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      order: ${{ steps.order.outputs.value }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag still names the release commit
        run: python3 scripts/ci/release_tag.py verify
      - name: Clone the published marketplace
        run: git clone --quiet --depth 1 --branch main https://github.com/stackhawk/agent-skills-marketplace.git "$RUNNER_TEMP/marketplace"
      - name: Check marketplace release order
        id: order
        # Record the published pin before the dry-run sync changes this scratch clone.
        run: |
          value="$(python3 scripts/ci/marketplace_release_order.py "$RUNNER_TEMP/marketplace/sources.json" "$RELEASE_TAG" "$RELEASE_SHA")"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Release order of ${RELEASE_TAG} against the marketplace pin: ${value}"
          if [ "$value" = older ]; then
            echo "::warning::Marketplace already has a newer release than ${RELEASE_TAG}; this run publishes nothing"
          fi
      # The next four steps are the validate job of release.yml; tests/scripts/test_release_workflow.py
      # keeps the two in step.
      - name: Stamp the release version
        run: bash scripts/bump-version.sh "$RELEASE_VERSION"
      - name: Regenerate the wingman bundled skills
        # Also the skill copies of the Cursor-only hawkscan plugin (cursor-plugins/hawkscan/skills/).
        run: bash scripts/generate-wingman-skills.sh
      - name: Validate the stamped tree
        # The layout check covers direct installs from this repository, which is a Claude Code
        # and a Cursor marketplace too: no install may load the router rule or the stop hook twice,
        # also a Claude Code install next to one native Cursor install.
        run: |
          bash scripts/check-version.sh "$RELEASE_VERSION"
          bash scripts/test-wingman-skills.sh
          python3 scripts/check-marketplace-layout.py --no-installers .
      - name: Verify the Cursor adapter is up to date
        # The stamp adds a version to each .cursor-plugin/plugin.json; the generator keeps it.
        run: python3 scripts/generate-cursor-adapter.py --check
      # The export reads the commit, not this stamped working tree, and stamps its own copy.
      - name: Export the marketplace payload
        run: |
          python3 scripts/export-marketplace.py --ref "$RELEASE_SHA" --version "$RELEASE_VERSION" \
            --dest "$RUNNER_TEMP/marketplace-export"
      # The marketplace is public, so this clone needs no token, and nothing here is pushed.
      - name: Dry-run the marketplace sync
        run: |
          python3 "$RUNNER_TEMP/marketplace/scripts/sync-agent-skills.py" \
            --source-repo "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --export "$RUNNER_TEMP/marketplace-export"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s "$RUNNER_TEMP/marketplace/tests"
          python3 scripts/check-marketplace-layout.py --run-installers --version "$RELEASE_VERSION" \
            "$RUNNER_TEMP/marketplace"
          bash scripts/ci/stage-marketplace-sync.sh "$RUNNER_TEMP/marketplace"

  # The GitHub Release is drafted before the marketplace push, where nobody can see it, and published
  # after it: a failed run must not leave a public release for a tag that users cannot install.
  # A tag older than the marketplace pin skips this job, and with it, because a job whose `needs`
  # was skipped is skipped, update-marketplace, publish-release and capture-baseline. The older-tag
  # step of update-marketplace is a second guard, for a pin that moves after validate.
  draft-release:
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.order != 'older'
    needs: [resolve, validate]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      exists: ${{ steps.lookup.outputs.exists }}
      previous: ${{ steps.lookup.outputs.previous }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Verify the tag still names the release commit
        run: python3 scripts/ci/release_tag.py verify
      - name: Install the GitHub CLI
        run: bash scripts/ci/install-gh.sh
      - name: Look up the GitHub Release
        id: lookup
        run: |
          # The API list includes drafts, which `gh release view <tag>` does not find.
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id")"
          if [ -n "$existing" ]; then
            echo "GitHub Release already exists for ${RELEASE_TAG}"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'exists=false' >> "$GITHUB_OUTPUT"
          # Every merge makes a tag, but only a published tag gets a release. The notes cover
          # everything since the last release, not only the last merge.
          previous="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "Release notes start at ${previous:-the first commit}"
      - name: Draft the GitHub Release
        if: ${{ !inputs.rehearsal && steps.lookup.outputs.exists != 'true' }}
        env:
          PREVIOUS_RELEASE: ${{ steps.lookup.outputs.previous }}
        run: |
          args=(--draft --verify-tag --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes)
          if [ -n "$PREVIOUS_RELEASE" ]; then
            args+=(--notes-start-tag "$PREVIOUS_RELEASE")
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"

  update-marketplace:
    name: Sync marketplace
    if: github.ref == 'refs/heads/main'
    needs: [resolve, draft-release]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      order: ${{ steps.order.outputs.value }}
      published: ${{ steps.push.outputs.published || steps.older.outputs.published }}
    env:
      CI_ROLES: ${{ vars.CI_ROLES }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      ### Biodome setup
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Check out the release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag still names the release commit
        run: python3 scripts/ci/release_tag.py verify
      - name: Clone agent-skills-marketplace
        # A re-run on a runner that kept the earlier clone starts from a fresh one.
        run: |
          rm -rf /tmp/marketplace
          git clone --quiet --branch main https://github.com/stackhawk/agent-skills-marketplace.git /tmp/marketplace
      - name: Check marketplace release order
        id: order
        # A newer tag or a manual sync may have reached marketplace main after validate.
        run: |
          value="$(python3 scripts/ci/marketplace_release_order.py /tmp/marketplace/sources.json "$RELEASE_TAG" "$RELEASE_SHA")"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Skip an older tag
        id: older
        if: steps.order.outputs.value == 'older'
        run: |
          echo "::warning::Marketplace already has a newer release than ${RELEASE_TAG}; nothing was published"
          echo 'published=false' >> "$GITHUB_OUTPUT"
      # The tagged tree carries the placeholder: the export stamps the tag's version into the
      # payload, and the sync checks that the payload is of the tag's commit and version.
      - name: Export the marketplace payload from the release commit
        if: steps.order.outputs.value != 'older'
        run: |
          python3 scripts/export-marketplace.py --ref "$RELEASE_SHA" --version "$RELEASE_VERSION" \
            --dest "$RUNNER_TEMP/marketplace-export"
      - name: Sync marketplace from release tag
        if: steps.order.outputs.value != 'older'
        run: |
          python3 /tmp/marketplace/scripts/sync-agent-skills.py \
            --source-repo "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --export "$RUNNER_TEMP/marketplace-export"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s /tmp/marketplace/tests
          python3 scripts/check-marketplace-layout.py --run-installers --version "$RELEASE_VERSION" /tmp/marketplace
      # The marketplace's own code (sync, tests, installers) ran in the clone at /tmp/marketplace, so
      # nothing it left in that clone's .git (hooks, config) may meet the role or the token. The commit
      # is made here, before the role exists, with hooks, fsmonitor, credential helpers and commit
      # signing switched off as defense in depth; it is then fetched into a new repository made without
      # a template, and from the role on every git command runs there, with git's global and system
      # config switched off too (the runner user's own config is as writable as the clone's). This does
      # not sandbox the marketplace's code from the job: it could still change what runs through
      # GITHUB_ENV, GITHUB_PATH or the workspace.
      - name: Commit the marketplace sync
        if: steps.order.outputs.value != 'older'
        run: |
          export GIT_CONFIG_COUNT=4
          export GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
          export GIT_CONFIG_KEY_1=core.fsmonitor GIT_CONFIG_VALUE_1=false
          export GIT_CONFIG_KEY_2=credential.helper GIT_CONFIG_VALUE_2=
          export GIT_CONFIG_KEY_3=commit.gpgsign GIT_CONFIG_VALUE_3=false
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_NOSYSTEM=1
          # A git older than 2.32 ignores GIT_CONFIG_GLOBAL, GIT_CONFIG_SYSTEM and GIT_CONFIG_COUNT without a word.
          version="$(git version | sed -e 's/^git version //' -e 's/[^0-9.].*$//')"
          if [ "$(printf '%s\n' 2.32 "$version" | sort -V | head -n 1)" != 2.32 ]; then
            echo "::error::git ${version} is too old to switch off its global config and hooks (needs 2.32)"
            exit 1
          fi
          git -C /tmp/marketplace config user.name hawkdeploy
          git -C /tmp/marketplace config user.email hawkdeploy@stackhawk.com
          bash "$GITHUB_WORKSPACE/scripts/ci/stage-marketplace-sync.sh" /tmp/marketplace
          python3 scripts/ci/release_tag.py verify
          rm -rf "$RUNNER_TEMP/marketplace-push"
          if git -C /tmp/marketplace diff --cached --quiet; then
            exit 0
          fi
          git -C /tmp/marketplace commit -q -m "chore: sync agent-skills ${RELEASE_TAG}"
          # No template: a template from a global config would copy hooks into the new repository.
          git init -q --template= "$RUNNER_TEMP/marketplace-push"
          git -C "$RUNNER_TEMP/marketplace-push" fetch -q /tmp/marketplace HEAD
      - name: CI identity (ci-deploy-preprod)
        if: steps.order.outputs.value != 'older'
        run: |
          biodome-rs aws assume ci-deploy-preprod --profile deploy --source oidc
          echo "AWS_PROFILE=deploy" >> "$GITHUB_ENV"
      # What a rehearsal does in place of the push: the same token, minted the same way, and the same new
      # repository, hardened the same way. The token only reads here (ls-remote) and asks the marketplace
      # whether it would take the push (--dry-run sends nothing), so the run proves the App can write
      # the marketplace without writing it.
      - name: Rehearse the marketplace push
        if: ${{ inputs.rehearsal && steps.order.outputs.value != 'older' }}
        run: |
          export GIT_CONFIG_COUNT=4
          export GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
          export GIT_CONFIG_KEY_1=core.fsmonitor GIT_CONFIG_VALUE_1=false
          export GIT_CONFIG_KEY_2=credential.helper GIT_CONFIG_VALUE_2=
          export GIT_CONFIG_KEY_3=commit.gpgsign GIT_CONFIG_VALUE_3=false
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_NOSYSTEM=1
          push="$RUNNER_TEMP/marketplace-push"
          token="$(biodome ci github-app-token --repository agent-skills-marketplace --permission contents=write)"
          echo "::add-mask::$token"
          git ls-remote "https://x-access-token:${token}@github.com/stackhawk/agent-skills-marketplace.git" refs/heads/main
          if [ -d "$push" ]; then
            git -C "$push" push --dry-run "https://x-access-token:${token}@github.com/stackhawk/agent-skills-marketplace.git" FETCH_HEAD:refs/heads/main
            echo "Rehearsal: marketplace main would take the sync commit for ${RELEASE_TAG}; nothing was pushed"
          else
            echo "Rehearsal: marketplace already contains ${RELEASE_TAG}; there is nothing to push"
          fi
      # The App's token replaces the retired Terraform GitHub token. It writes the marketplace repo
      # only, and exists only while this push runs: never in GITHUB_ENV, never written into any git
      # config (the push goes to the URL), and only ever used by a push from the new repository.
      - name: Push marketplace sync to main
        id: push
        if: steps.order.outputs.value != 'older' && !inputs.rehearsal
        run: |
          export GIT_CONFIG_COUNT=4
          export GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
          export GIT_CONFIG_KEY_1=core.fsmonitor GIT_CONFIG_VALUE_1=false
          export GIT_CONFIG_KEY_2=credential.helper GIT_CONFIG_VALUE_2=
          export GIT_CONFIG_KEY_3=commit.gpgsign GIT_CONFIG_VALUE_3=false
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_NOSYSTEM=1
          push="$RUNNER_TEMP/marketplace-push"
          if [ ! -d "$push" ]; then
            echo "Marketplace already contains ${RELEASE_TAG}"
            echo 'published=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          token="$(biodome ci github-app-token --repository agent-skills-marketplace --permission contents=write)"
          echo "::add-mask::$token"
          if ! git -C "$push" push "https://x-access-token:${token}@github.com/stackhawk/agent-skills-marketplace.git" FETCH_HEAD:refs/heads/main; then
            # Marketplace main moved during the push. An older tag stops with nothing published, and a
            # newer or equal one is re-run, which checks everything again before the role is assumed.
            unset token
            git -C "$push" fetch -q https://github.com/stackhawk/agent-skills-marketplace.git main
            git -C "$push" show FETCH_HEAD:sources.json > "$RUNNER_TEMP/current-sources.json"
            order="$(python3 scripts/ci/marketplace_release_order.py "$RUNNER_TEMP/current-sources.json" "$RELEASE_TAG" "$RELEASE_SHA")"
            if [ "$order" = older ]; then
              echo "::warning::Marketplace advanced past ${RELEASE_TAG}; nothing was published and nothing was rolled back"
              echo 'published=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Marketplace main moved while ${RELEASE_TAG} was being pushed; re-run this job"
            exit 1
          fi
          echo 'published=true' >> "$GITHUB_OUTPUT"

  # In a rehearsal this job runs when a real run would reach it (the tag is not older than the pin), to
  # look the release up; it publishes nothing.
  publish-release:
    if: github.ref == 'refs/heads/main' && (needs.update-marketplace.outputs.published == 'true' || (inputs.rehearsal && needs.update-marketplace.outputs.order != 'older'))
    needs: [resolve, update-marketplace]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      newly: ${{ steps.publish.outputs.newly }}
      state: ${{ steps.lookup.outputs.state }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Verify the tag still names the release commit
        run: python3 scripts/ci/release_tag.py verify
      - name: Install the GitHub CLI
        run: bash scripts/ci/install-gh.sh
      - name: Look up the GitHub Release
        id: lookup
        run: |
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | \"\\(.id) \\(.draft)\"")"
          if [ -z "$release" ]; then
            state=missing
          elif [ "${release#* }" = false ]; then
            state=published
          else
            state=draft
          fi
          echo "GitHub Release ${RELEASE_TAG}: ${state}"
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "id=${release% *}" >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub Release
        id: publish
        if: ${{ !inputs.rehearsal }}
        env:
          RELEASE_STATE: ${{ steps.lookup.outputs.state }}
          RELEASE_ID: ${{ steps.lookup.outputs.id }}
        run: |
          if [ "$RELEASE_STATE" = missing ]; then
            echo "ERROR: no GitHub Release for ${RELEASE_TAG}"
            exit 1
          fi
          if [ "$RELEASE_STATE" = published ]; then
            echo "GitHub Release ${RELEASE_TAG} is already published"
            exit 0
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false
          echo 'newly=true' >> "$GITHUB_OUTPUT"

  # Only for a release this run published: running the tag that is already published again must not
  # capture its baseline a second time. Best effort: the release is published once the marketplace has
  # it, so a baseline that cannot be dispatched warns instead of failing the run. Dispatch Capture Eval
  # Baseline by hand with the tag. A rehearsal runs the job to check the dispatch token and does not
  # dispatch.
  capture-baseline:
    name: Trigger baseline capture
    if: github.ref == 'refs/heads/main' && (needs.publish-release.outputs.newly == 'true' || inputs.rehearsal)
    needs: [resolve, publish-release]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CI_ROLES: ${{ vars.CI_ROLES }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      ### Biodome setup
      - name: Biodome job setup
        uses: ./../../../../../home/runner/.github/actions/biodome-setup-v2
      - name: Check out the release scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Verify the tag still names the release commit
        run: python3 scripts/ci/release_tag.py verify
      - name: CI identity (ci-deploy-preprod)
        run: |
          biodome-rs aws assume ci-deploy-preprod --profile deploy --source oidc
          echo "AWS_PROFILE=deploy" >> "$GITHUB_ENV"
      - name: Install the GitHub CLI
        continue-on-error: true
        run: bash scripts/ci/install-gh.sh
      - name: Rehearse the baseline dispatch
        if: ${{ inputs.rehearsal }}
        run: |
          token="$(biodome ci github-app-token --repository "${GITHUB_REPOSITORY#*/}" --permission actions=write)"
          echo "::add-mask::$token"
          GH_TOKEN="$token" gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/capture-baseline.yml" --jq '"Rehearsal: capture-baseline.yml is " + .state + "; nothing was dispatched"'
      - name: Dispatch capture-baseline
        if: ${{ !inputs.rehearsal }}
        run: |
          token="$(biodome ci github-app-token --repository "${GITHUB_REPOSITORY#*/}" --permission actions=write)"
          echo "::add-mask::$token"
          if ! GH_TOKEN="$token" gh workflow run capture-baseline.yml -f tag="$RELEASE_TAG"; then
            echo "::warning::could not dispatch capture-baseline.yml for ${RELEASE_TAG}; run it by hand"
          fi

  # A rehearsal's report: what ran, and what a real run would have done. It runs whether or not the
  # rehearsal passed, and only for a rehearsal.
  rehearsal-summary:
    name: Rehearsal summary
    if: github.ref == 'refs/heads/main' && always() && inputs.rehearsal
    needs: [resolve, validate, draft-release, update-marketplace, publish-release, capture-baseline]
    runs-on: agent-skills-amd-4cpu
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      ORDER: ${{ needs.update-marketplace.outputs.order || needs.validate.outputs.order }}
      RELEASE_STATE: ${{ needs.publish-release.outputs.state }}
      PREVIOUS_RELEASE: ${{ needs.draft-release.outputs.previous }}
      RESULT_RESOLVE: ${{ needs.resolve.result }}
      RESULT_VALIDATE: ${{ needs.validate.result }}
      RESULT_DRAFT: ${{ needs.draft-release.result }}
      RESULT_MARKETPLACE: ${{ needs.update-marketplace.result }}
      RESULT_PUBLISH: ${{ needs.publish-release.result }}
      RESULT_BASELINE: ${{ needs.capture-baseline.result }}
    steps:
      - name: Report the rehearsal
        run: |
          failed=
          for result in "$RESULT_RESOLVE" "$RESULT_VALIDATE" "$RESULT_DRAFT" "$RESULT_MARKETPLACE" "$RESULT_PUBLISH" "$RESULT_BASELINE"; do
            case "$result" in failure|cancelled) failed=yes ;; esac
          done
          {
            echo "## Publish release ${RELEASE_TAG:-(tag not resolved)}: rehearsal"
            echo
            if [ -n "$failed" ]; then
              echo "**This rehearsal failed. Nothing was pushed to the marketplace, no GitHub Release was created or published, and no baseline was dispatched.** A real run would have failed in the same place."
            else
              echo "**This was a rehearsal. Nothing was pushed to the marketplace, no GitHub Release was created or published, and no baseline was dispatched.**"
            fi
            echo
            echo "| Job | Rehearsal result |"
            echo "| --- | --- |"
            echo "| Resolve and verify the tag | ${RESULT_RESOLVE} |"
            echo "| Validate and export the tag commit | ${RESULT_VALIDATE} |"
            echo "| Look up the GitHub Release | ${RESULT_DRAFT} |"
            echo "| Role, marketplace token and sync into the scratch clone | ${RESULT_MARKETPLACE} |"
            echo "| Look up the GitHub Release again | ${RESULT_PUBLISH} |"
            echo "| Baseline dispatch token | ${RESULT_BASELINE} |"
            echo
            if [ -z "$failed" ]; then
              echo "Release order against the marketplace pin: **${ORDER:-unknown}**. A real run of ${RELEASE_TAG} (${RELEASE_SHA}) would:"
              echo
              case "$ORDER" in
                older)
                  echo "- publish nothing: the marketplace already has a newer release than ${RELEASE_TAG}" ;;
                current)
                  echo "- push nothing to the marketplace: it already has ${RELEASE_TAG}" ;;
                *)
                  echo "- push the sync commit \"chore: sync agent-skills ${RELEASE_TAG}\" to marketplace main" ;;
              esac
              if [ "$ORDER" != older ]; then
                case "$RELEASE_STATE" in
                  published)
                    echo "- leave the GitHub Release as it is, because it is already published, and not dispatch the baseline" ;;
                  draft)
                    echo "- publish the existing draft GitHub Release, then dispatch Capture Eval Baseline for ${RELEASE_TAG}" ;;
                  *)
                    echo "- draft the GitHub Release with notes since ${PREVIOUS_RELEASE:-the first commit}, publish it after the marketplace push, then dispatch Capture Eval Baseline for ${RELEASE_TAG}" ;;
                esac
              fi
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
