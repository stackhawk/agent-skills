name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: stackhawk/.github-private/.github/workflows/claude-pr-review.yml@main
    with:
      skills: 'bash,yaml,markdown,claude,skills,agent,plugins,marketplace'
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
