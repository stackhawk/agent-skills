- id: hci-01
  should_trigger: true
  invocation_type: explicit
  prompt: Use $hawkscan-ci to wire HawkScan into my GitHub Actions pipeline. My repo
    has .github/workflows/ci.yml with a build job, and stackhawk.yml validates.
  notes: Direct skill reference by name; baseline — if this fails everything else is moot
- id: hci-02
  should_trigger: true
  invocation_type: explicit
  prompt: Use the hawkscan-ci skill to add StackHawk to my pipeline. We're on GitHub
    Actions and the local scan already works.
  notes: Skill name in natural language
- id: hci-03
  should_trigger: true
  invocation_type: implicit
  prompt: Set up hawkscan in CI. The repo uses GitHub Actions (.github/workflows/ci.yml)
    and stackhawk.yml is validated.
  notes: Core description keyword 'set up hawkscan in CI'
- id: hci-04
  should_trigger: true
  invocation_type: implicit
  prompt: Wire hawkscan into our ci/cd. We have a working local scan and a GitHub
    Actions workflow already.
  notes: 'Description keyword ''wire hawkscan into ci/cd'''
- id: hci-05
  should_trigger: true
  invocation_type: contextual
  prompt: My repo has .github/workflows/ci.yml (build + test) and a validated
    stackhawk.yml. Add a HawkScan job that runs on PRs and pushes to main, fails the
    build on findings, chained after the build. Use GitHub Actions secrets for the key.
  notes: Fully-specified GHA — expect native action and all four choices honored
  budget:
    cost_usd: 0.15
  expected:
  - signal: stackhawk/hawkscan-action
- id: hci-06
  should_trigger: true
  invocation_type: contextual
  prompt: We use GitLab CI (.gitlab-ci.yml) and stackhawk.yml is validated. Wire
    HawkScan into the pipeline.
  notes: GitLab — expect the mandatory HAWK_API_ID/HAWK_API_SECRET key-split call-out
  expected:
  - signal: HAWK_API_ID
- id: hci-07
  should_trigger: true
  invocation_type: contextual
  prompt: Our pipeline is a Jenkinsfile and the local scan works. Add HawkScan
    scanning to it.
  notes: Jenkins — expect Credentials Store (UI) secret path
